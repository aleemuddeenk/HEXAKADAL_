server.port=8081
spring.application.name=hexakadal-backend

# Data CSV Files Configuration
hexakadal.data.path=../data

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.marineApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.marineApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.marineApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.marineApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.marineApi.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.marineApi.failureRateThreshold=50.0

# Resilience4j Retry Config
resilience4j.retry.instances.marineApi.maxAttempts=3
resilience4j.retry.instances.marineApi.waitDuration=500ms
resilience4j.retry.instances.marineApi.enableExponentialBackoff=true

# Logging
logging.level.com.hexakadal=INFO
logging.level.org.springframework.web=INFO
